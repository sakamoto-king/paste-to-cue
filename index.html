/* 左侧目录 */

  box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tcq-content .cue-term { color: var(--term); font-weight: 600; letter-spacing: .01em; }
/* 防出框 */
#app, #workspace, #stageWrap, #stage, #scroller { min-width: 0; max-width: 100%; box-sizing: border-box; }
#stage, #scroller { overflow-x: hidden; }
.tcq-content :is(table, colgroup, col, tbody, thead, tr, td, th, p, div, span, li, ul, ol, h1, h2, h3, h4, h5, h6, blockquote, pre, img, .cue-seg) { max-width: 100% !important; box-sizing: border-box; overflow-wrap: break-word; word-break: break-word; }
.tcq-content :is(td, th, p, div, span, li, pre, font, b, strong) { white-space: normal !important; }
.tcq-content img { height: auto; }
.tcq-content mark, .tcq-content [style*="background"] { padding-top: 0 !important; padding-bottom: 0 !important; line-height: inherit; }

#editTag { position: absolute; top: 10px; right: 14px; z-index: 8; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg3);
  background: color-mix(in srgb, var(--card) 85%, transparent); box-shadow: inset 0 0 0 1px var(--border); border-radius: 999px; padding: 3px 10px; pointer-events: none; }
body.cue #editTag { display: none; }
#cueCap { position: absolute; top: 12px; left: 14px; z-index: 20; display: none; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 999px;
  background: color-mix(in srgb, var(--card) 70%, transparent); box-shadow: inset 0 0 0 1px var(--border); backdrop-filter: blur(8px); font-size: 12px; color: var(--fg2); opacity: .62; transition: opacity .2s; }
#cueCap:hover { opacity: 1; }
body.cue #cueCap { display: inline-flex; }
#cueCap button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 550; color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); background: var(--muted); }
#cueCap .pg { font: 500 12px var(--mono); color: var(--fg); padding: 0 2px; }
#cueCap .tag { color: var(--fg3); white-space: nowrap; }

/* 右侧触控栏 */
.tcq-touch { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; padding: 12px; border-left: 1px solid var(--border); background: color-mix(in srgb, var(--card) 60%, var(--bg)); min-width: 0; overflow: hidden; user-select: none; }
.tcq-touch .sz { flex: none; padding: 10px 11px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--border); background: var(--card); font-size: 11.5px; }
.tcq-touch .sz .t { display: flex; align-items: center; gap: 6px; color: var(--fg2); }
.tcq-touch .sz .t b { margin-left: auto; font: 600 12px var(--mono); color: var(--fg); cursor: pointer; }
.tcq-touch .sz .row { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; }
.tcq-touch .sz .row button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--border); flex: none; }
.tcq-touch .sz .row button:hover { color: var(--fg); }
.tcq-touch input[type="range"] { flex: 1; min-width: 0; width: 100%; }
.tcq-touch .ticks { display: flex; justify-content: space-between; font: 500 10px var(--mono); color: var(--fg3); }
.tcq-touch .spd { display: flex; align-items: center; gap: 6px; color: var(--fg2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.tcq-touch .spd b { margin-left: auto; font: 600 12px var(--mono); color: var(--fg); }
.tcq-touch .zone { flex: 1 1 0; min-height: 0; position: relative; overflow: hidden; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--border); background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--fg2); transition: box-shadow .2s, background .2s; cursor: ns-resize; }
.tcq-touch .zone:hover { box-shadow: inset 0 0 0 1px var(--border2), 0 0 24px color-mix(in srgb, var(--accent) 6%, transparent); }
.tcq-touch .zone .zbar { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.tcq-touch .up .zbar { bottom: 0; background: linear-gradient(to top, color-mix(in srgb, var(--accent) 16%, transparent), transparent); }
.tcq-touch .down .zbar { top: 0; background: linear-gradient(to bottom, color-mix(in srgb, var(--accent) 16%, transparent), transparent); }
.tcq-touch .ci { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--border); background: var(--muted); color: var(--fg); transition: transform .2s; }
.tcq-touch .zone.active .ci { transform: scale(1.06); box-shadow: inset 0 0 0 1px var(--ring); }
.tcq-touch .zlab { position: relative; pointer-events: none; padding: 0 8px; font-variant-numeric: tabular-nums; }
.tcq-touch .zlab b { display: block; font-size: 13.5px; font-weight: 600; color: var(--fg); }
.tcq-touch .zlab small { display: block; font-size: 11px; color: var(--fg3); line-height: 1.45; margin-top: 3px; white-space: pre-line; }
.tcq-touch .zone.mid { flex: .82 1 0; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ring); }
.tcq-touch .zone.mid .ci { background: var(--primary); color: var(--pfg); box-shadow: none; }
.tcq-touch .zone.mid:hover { background: color-mix(in srgb, var(--muted) 70%, var(--card)); }

/* 语音监控小窗 */
#vmon { position: absolute; left: 16px; bottom: 16px; width: 330px; z-index: 30; border-radius: var(--radius); background: color-mix(in srgb, var(--pop) 94%, transparent);
  box-shadow: var(--pop-shadow); backdrop-filter: blur(16px); font-size: 12.5px; color: var(--fg); }
#vmon .vm-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; cursor: move; font-weight: 600; }
#vmon.folded .vm-head { padding-bottom: 10px; }
#vmon .vm-state { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vmon .vm-lang { font: 500 11px var(--mono); color: var(--fg3); }
#vmon .vm-fold { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: var(--fg2); transition: transform .2s; }
#vmon .vm-fold:hover { background: var(--muted); color: var(--fg); }
#vmon.folded .vm-fold { transform: rotate(180deg); }
#vmon .vm-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg3); flex: 0 0 auto; transition: box-shadow .15s; }
#vmon[data-state="connecting"] .vm-dot { background: var(--warn); animation: blink .9s infinite; }
#vmon[data-state="live"] .vm-dot, #vmon[data-state="sim"] .vm-dot { background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 22%, transparent); animation: breathe 2.2s ease-in-out infinite; }
#vmon .vm-dot.beat { box-shadow: 0 0 0 5px color-mix(in srgb, var(--live) 30%, transparent), 0 0 12px var(--live) !important; }
#vmon[data-state^="err"] .vm-dot { background: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 22%, transparent); }
#vmon[data-state^="err"] { box-shadow: 0 0 0 1px color-mix(in srgb, var(--danger) 55%, transparent), 0 16px 40px rgba(0,0,0,.35); }
@keyframes blink { 50% { opacity: .35; } }
@keyframes breathe { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--live) 10%, transparent); } }
#vmon .vm-body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
#vmon.folded .vm-body { display: none; }
#vmon .vm-meter { display: flex; align-items: center; gap: 8px; height: 32px; }
#vmon .vm-cells { display: flex; align-items: center; gap: 3px; height: 32px; }
#vmon .vm-cells i { width: 4px; height: 4px; border-radius: 2px; background: var(--border2); transition: height 90ms linear, background 90ms; }
#vmon .vm-cells i.on { background: var(--live); height: calc(4px + (var(--h) - 4px) * (0.45 + var(--lv, 0) * 0.55)); }
#vmon .vm-cells i.on.y { background: color-mix(in srgb, var(--live) 70%, var(--warn)); }
#vmon .vm-cells i.on.r { background: var(--warn); }
#vmon .vm-db { margin-left: auto; font: 500 11px var(--mono); color: var(--fg3); }
#vmon .vm-dev { color: var(--fg3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
#vmon .vm-text { height: 56px; overflow: hidden; background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); border-radius: 7px; padding: 6px 9px; font-size: 13px; line-height: 1.45;
  display: flex; flex-direction: column; justify-content: flex-end; word-break: break-word; }
#vmon .vm-text .fin { color: var(--fg2); }
#vmon .vm-text .int { color: var(--fg); font-weight: 550; }
html[data-theme="paper"] #vmon .vm-text .int { color: var(--accent); }
#vmon .vm-text .ph { color: var(--fg3); font-size: 12px; }
#vmon .vm-hint { font-size: 11.5px; line-height: 1.5; color: var(--fg3); }
#vmon .vm-hint.bad { color: var(--danger); }
#vmon .vm-hint.warn { color: var(--warn); }
#vmon .vm-hint:empty { display: none; }
#vmon .vm-foot { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--fg2); min-width: 0; }
#vmon .vm-foot .ic { color: var(--fg3); }
#vmon .vm-match { flex: 0 1 auto; min-width: 0; max-width: 58%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vmon .vm-match.hit { color: var(--fg); } #vmon .vm-match.miss { color: var(--warn); }
#vmon .vm-bar { flex: 1 1 40px; height: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; min-width: 30px; }
#vmon .vm-bar i { display: block; height: 100%; width: 0; background: var(--live); transition: width .25s; }
#vmon .vm-pct { font: 500 11px var(--mono); color: var(--fg2); min-width: 32px; text-align: right; }
#vmon .vm-actions { display: flex; gap: 6px; flex-wrap: wrap; }
#vmon .vm-actions button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 550; color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); background: var(--muted); }
#vmon .vm-actions button:hover { box-shadow: inset 0 0 0 1px var(--border2); }
#vmon .vm-actions button.go { background: var(--primary); color: var(--pfg); box-shadow: none; }
#vmon .vm-actions button.stop { color: var(--danger); }
body:not(.cue) #vmon { opacity: .96; }

/* 其它浮层 */
#count { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font: 700 28vh var(--mono); color: var(--fg); z-index: 80; background: var(--scrim); }

.menu { display: none; position: fixed; top: 0; left: 0; z-index: 110; min-width: 240px; background: var(--pop); box-shadow: var(--pop-shadow); border-radius: var(--radius); padding: 6px; font-size: 13px; }

.menu label:hover { background: var(--muted); }
.menu input { accent-color: var(--accent); }
.fm-sep { height: 1px; background: var(--border); margin: 4px 0; }
#selBar { position: fixed; z-index: 90; display: none; gap: 2px; padding: 3px; border-radius: 8px; background: var(--pop); box-shadow: var(--pop-shadow); }

  #sideResizer { display: none; } #side { visibility: hidden; }

}

window.__EXAMPLE_HTML__ = "<h2 data-cue-toc=\"边读边学\">Paste to Cue · 边读边学</h2>\n<table border=\"1\" style=\"border-collapse:collapse;width:100%;font-size:1em\">\n  <thead>\n    <tr style=\"background:#1F2937;color:#F8FAFC\">\n      <th style=\"padding:10px 12px;width:3.6em;white-space:nowrap\">镜号</th>\n      <th style=\"padding:10px 12px\">口播文案</th>\n      <th style=\"padding:10px 12px;width:24%;white-space:nowrap\">小提示</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">01</td>\n      <td style=\"padding:10px 12px;color:#111111\">我现在录这条视频用的提词器，叫做 <strong>Paste to Cue</strong>。</td>\n      <td style=\"padding:10px 12px;color:#EF4444\">重音：Paste to Cue</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">02</td>\n      <td style=\"padding:10px 12px;color:#111111\">以前我录口播最头疼两件事：要么自己拿鼠标一边读一边滑，眼神老往旁边飘；要么开匀速滚动，稍微卡壳一下，字幕就自己跑没影了。</td>\n      <td style=\"padding:10px 12px;color:#64748B\">停半拍</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">03</td>\n      <td style=\"padding:10px 12px;color:#111111\">但现在你看，我只要直接开口往下念，屏幕上的词就会<span style=\"background:#FEF08A;color:#111\">跟着我的声音</span>稳稳往上走。</td>\n      <td style=\"padding:10px 12px;color:#2563EB\">镜头推进</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">04</td>\n      <td style=\"padding:10px 12px;color:#111111\">哪怕我中间换口气、临场改两个词，或者稍微停顿一下，它也会在原地等我，<strong>不会自己乱跳</strong>。</td>\n      <td style=\"padding:10px 12px;color:#EF4444\">重音：不会自己乱跳</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">05</td>\n      <td style=\"padding:10px 12px;color:#111111\">平时写好稿子，不管是飞书、Word 还是 Notion 里的表格，直接按 Ctrl + V 粘进来就行，原本标的<strong style=\"color:#e53935\">重点粗体</strong>、彩色字还有<span style=\"background:#FEF08A;color:#111\">荧光笔高亮</span>全都原样保留。</td>\n      <td style=\"padding:10px 12px;color:#16A34A\">展示保样式</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">06</td>\n      <td style=\"padding:10px 12px;color:#111111\">如果粘进来的排版有点乱，点一下「格式化」，不到 <b>60</b> 秒就能规整得干干净净，重点标记一个都不会丢。</td>\n      <td style=\"padding:10px 12px;color:#64748B\">语速放慢</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">07</td>\n      <td style=\"padding:10px 12px;color:#111111\">开拍之后，你只要把眼神盯住屏幕上方的黄金视线，需要手动快进或者倒回去重录一句，鼠标移到右边触控条轻轻一滑就能随时接管。</td>\n      <td style=\"padding:10px 12px;color:#2563EB\">看镜头</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">08</td>\n      <td style=\"padding:10px 12px;color:#111111\">字号还支持从百分之五十一直放大到 <b>500%</b>，就算把浏览器缩成窄窄一条贴在摄像头旁边，文字也会自动折行，绝不会撑出屏幕。</td>\n      <td style=\"padding:10px 12px;color:#EF4444\">重音：500%</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">09</td>\n      <td style=\"padding:10px 12px;color:#111111\">而且它不用注册，所有文稿都只存在我自己的浏览器本地，关掉网页下次打开还能接着录，完全不用担心稿子外泄。</td>\n      <td style=\"padding:10px 12px;color:#64748B\">轻松一点</td>\n    </tr>\n    <tr>\n      <td style=\"padding:10px 12px;font-weight:700;color:#F59E0B\">10</td>\n      <td style=\"padding:10px 12px;color:#111111\">你现在也可以直接点左下角的麦克风，跟着我这几句话开口念两句，亲自试试这种<span style=\"background:#FEF08A;color:#111\">话到词到</span>的手感。</td>\n      <td style=\"padding:10px 12px;color:#16A34A\">收尾邀请</td>\n    </tr>\n  </tbody>\n</table>\n<p style=\"color:#94A3B8;font-size:0.8em;margin-top:1.2em\">（演示样例 · 粘贴飞书 / Notion / Word 表格会保留颜色、加粗与单元格。暗底下纯黑字会自动反白，彩色强调与黄底高亮原样保留。）</p>";
window.__EXAMPLE_EN_HTML__ = "<h2 class=\"cue-title\" data-cue-id=\"title\">Learn Paste to Cue aloud</h2>\n<div class=\"cue-seg\" data-idx=\"01\" data-cue-id=\"seg-01\">The teleprompter I'm using right now is called <span class=\"cue-term\">Paste to Cue</span>.</div>\n<div class=\"cue-seg\" data-idx=\"02\" data-cue-id=\"seg-02\">Before this, two things drove me crazy: dragging a mouse while I talked, or watching a <strong class=\"cue-stress\">constant scroll</strong> run away the second I paused.</div>\n<div class=\"cue-seg\" data-idx=\"03\" data-cue-id=\"seg-03\">Now I just speak, and the words glide up <mark class=\"cue-key\">with my voice</mark>.</div>\n<div class=\"cue-seg\" data-idx=\"04\" data-cue-id=\"seg-04\">If I stumble? Give yourself <mark class=\"cue-key\">7</mark> seconds — it holds the line until I pick back up. It waits; it doesn't jump ahead.</div>\n<div class=\"cue-seg\" data-idx=\"05\" data-cue-id=\"seg-05\">Write in Docs, Word, or Notion, hit paste, and your <strong class=\"cue-stress\">bold</strong>, colors, and <mark class=\"cue-key\">highlights</mark> stay exactly where you put them.</div>\n<div class=\"cue-seg\" data-idx=\"06\" data-cue-id=\"seg-06\">Messy layout? One tap on Format cleans it in under <mark class=\"cue-key\">60</mark> seconds without dropping a single mark.</div>\n<div class=\"cue-seg\" data-idx=\"07\" data-cue-id=\"seg-07\">Keep your eyes on the golden eyeline near the top. Need a redo? Slide the right-hand rail and take over anytime.</div>\n<div class=\"cue-seg\" data-idx=\"08\" data-cue-id=\"seg-08\">Zoom from fifty percent all the way to <mark class=\"cue-key\">500%</mark> — even a skinny sidebar next to the camera still wraps cleanly.</div>\n<div class=\"cue-seg\" data-idx=\"09\" data-cue-id=\"seg-09\">No signup. Your script lives only in this browser, so you can close the tab and pick up later without leaking a line.</div>\n<div class=\"cue-seg\" data-idx=\"10\" data-cue-id=\"seg-10\">Click the mic below and read a few lines out loud — feel that <mark class=\"cue-key\">word-for-word</mark> follow for yourself.</div>";

    vmInterim.textContent = lastInterim ? (finals.length ? '　' : '') + lastInterim : '';
    vmPh.style.display = (finals.length || lastInterim) ? 'none' : '';
  }
  let beatT = null;
  function beat() {
    vmDot.classList.add('beat');
    clearTimeout(beatT);
    beatT = setTimeout(() => vmDot.classList.remove('beat'), 380);
  }

  // 16 格电平表（Web Audio）
  let audio = { stream: null, ctx: null, analyser: null, buf: null, level: 0 };
  let simLevel = 0;
  let lastLoudAt = 0;
  function drawCells(level) {
    const n = Math.round(clamp(level, 0, 1) * N_CELLS);
    vmCellsEl.style.setProperty('--lv', clamp(level, 0, 1).toFixed(2));
    for (let i = 0; i < N_CELLS; i++) vmCells[i].classList.toggle('on', i < n);
    drawCells.n = n;
  }
  async function startMeter() {
    stopMeter();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      vmDev.textContent = T('devNoMedia');
      return 'nomedia';
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      audio = { stream, ctx, analyser, buf: new Float32Array(analyser.fftSize), level: 0 };
      const tr = stream.getAudioTracks()[0];
      vmDev.textContent = (tr && tr.label) || T('devDefault');
      vmDev.title = vmDev.textContent;
      return 'ok';
    } catch (e) {
      const n = e && e.name;
      if (n === 'NotAllowedError' || n === 'SecurityError') return 'perm';
      if (n === 'NotReadableError' || n === 'AbortError') return 'busy';
      if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'nomic';
      return 'err:' + (n || 'unknown');

  }
  function stopMeter() {
    if (audio.stream) audio.stream.getTracks().forEach(t => { try { t.stop(); } catch {} });
    if (audio.ctx) { try { audio.ctx.close(); } catch {} }
    audio = { stream: null, ctx: null, analyser: null, buf: null, level: 0 };
    vmDev.textContent = T('devOff');
    drawCells(0);
  }
  function readLevel() {
    if (sim) { simLevel *= 0.9; return simLevel; }
    if (!audio.analyser) return 0;
    audio.analyser.getFloatTimeDomainData(audio.buf);
    let sum = 0;
    for (let i = 0; i < audio.buf.length; i++) sum += audio.buf[i] * audio.buf[i];
    const rms = Math.sqrt(sum / audio.buf.length);
    const db = 20 * Math.log10(rms + 1e-8);
    const lvl = clamp((db + 60) / 50, 0, 1);
    audio.level = Math.max(lvl, audio.level * 0.86);
    readLevel.db = Math.round(db);
    return audio.level;
  }

  // ─── Web Speech 识别（绝不静默假装在听）───
  let recognition = null;
  let micOn = false;
  let wantMic = false;
  let lastResultAt = 0;
  let restartLog = [];

  function startVoice() {
    enterCue();
    startMic();
  }
  async function startMic() {
    if (sim) stopSimulate(true);
    if (!SpeechRec) { setVState('errUnsupported'); return; }
    wantMic = true;
    restartLog = [];
    lastResultAt = 0;
    lastLoudAt = 0;
    finals = []; renderTranscript('');
    resetMatch();
    setVState('connecting');
    const m = await startMeter();
    if (!wantMic) { stopMeter(); return; }
    if (m === 'perm') { failVoice('errPerm'); return; }
    if (m === 'nomic') { failVoice('errNoMic'); return; }
    if (m === 'busy') { failVoice('errNoMic', { label: 'vBusy', hint: 'vBusyHint' }); return; }
    openRecognition();
  }
  function openRecognition() {
    if (recognition) { recognition.onend = null; try { recognition.abort(); } catch {} }
    const rec = new SpeechRec();
    rec.lang = recLangEff();
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onstart = () => {
      if (rec !== recognition) return;
      micOn = true;
      if (vstate !== 'live') setVState('live');
      followVoice = true;
    };
    rec.onresult = (ev) => {
      if (rec !== recognition) return;
      lastResultAt = Date.now();
      restartLog = [];
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        const t = r[0] ? r[0].transcript : '';
        if (r.isFinal) pushFinal(t); else interim += t;
      }
      if (vstate !== 'live') setVState('live');
      else if (silenceWarned) { silenceWarned = false; setHint(VSTATE.live.hint(), ''); }
      beat();
      renderTranscript(interim.trim());
      onHeard(interim.trim());
    };
    rec.onerror = (ev) => {
      if (rec !== recognition) return;
      const err = ev.error || 'error';
      if (err === 'no-speech' || err === 'aborted') return;
      if (err === 'network') { failVoice('errNet'); return; }
      if (err === 'not-allowed') { failVoice('errPerm'); return; }
      if (err === 'service-not-allowed') { failVoice('errNet', { label: 'vSvcNA', hint: 'vNetHint' }); return; }
      if (err === 'audio-capture') { failVoice('errNoMic'); return; }
      if (err === 'language-not-supported') { failVoice('errOther', { label: 'vLangNA', hint: 'vLangNAHint' }); return; }
      failVoice('errOther', { hint: 'vOtherHint' }); vmStateEl.textContent = T('vErrOther') + ' (' + err + ')';
    };
    rec.onend = () => {
      if (rec !== recognition) return;
      micOn = false;
      if (!wantMic) return;
      // 连续识别会话会被浏览器定期结束：自动续上；但反复秒断且无结果 = 判定服务不通，亮红灯
      const now = Date.now();
      restartLog = restartLog.filter(t => now - t < 15000);
      restartLog.push(now);
      if (restartLog.length > 5 && now - lastResultAt > 15000) {
        failVoice('errNet', { label: 'vFlap', hint: 'vNetHint' });
        return;
      }
      setTimeout(() => { if (wantMic && rec === recognition) { try { rec.start(); } catch {} } }, 250);
    };
    recognition = rec;
    try { rec.start(); }
    catch (e) { failVoice('errOther', { label: 'vNoStart' }); }
  }
  function failVoice(state, opts) {
    wantMic = false; // 停止无脑重连
    if (recognition) { recognition.onend = null; recognition.onerror = null; try { recognition.abort(); } catch {} recognition = null; }
    micOn = false;
    followVoice = false;
    // network 错误时保留电平表：绿格还在跳 = 麦克风是好的，只是语音服务不通
    if (state !== 'errNet') stopMeter();
    setVState(state, opts);
  }
  function stopMic() {
    wantMic = false;
    if (recognition) { recognition.onend = null; recognition.onerror = null; try { recognition.abort(); } catch {} recognition = null; }
    micOn = false;
    followVoice = false;
    manualOverride = false;
    stopMeter();
    setVState('off');
  }

  function monitorTick(now) {
    const lvl = (vstate === 'live' || vstate === 'errNet' || vstate === 'sim' || vstate === 'connecting') ? readLevel() : 0;
    drawCells(lvl);
    const dbEl = $('vmDb');
    const dbTxt = lvl > 0.01 ? (sim ? Math.round(lvl * 50 - 60) : (readLevel.db || -60)) + ' dB' : '-- dB';
    if (dbEl.textContent !== dbTxt && (!monitorTick._t || now - monitorTick._t > 120)) { dbEl.textContent = dbTxt; monitorTick._t = now; }
    if (vstate === 'live') {
      if (lvl > 0.45) { lastLoudAt = now; if (now - lastResultAt > 1500) beat(); }
      const since = Math.max(lastResultAt, liveSince);
      if (!silenceWarned && lastLoudAt > since && now - since > 7000 && now - lastLoudAt < 3000) {
        silenceWarned = true;
        setHint(T('vSilence'), 'warn');
      }
    }
  }

  // ─── 听写 → 台词命中 ───
  function rowInfo(idx) {
    const t = tokens[idx];
    if (!t) return null;
    const tr = t.node.parentElement && t.node.parentElement.closest('tr');
    let label = '';
    const seg = t.node.parentElement && t.node.parentElement.closest('.cue-seg');
    if (seg) label = seg.dataset.idx || '';
    else if (tr && tr.dataset.idx) label = tr.dataset.idx;
    else if (tr && tr.cells && tr.cells.length > 1 && tr.cells[0]) label = tr.cells[0].textContent.trim().slice(0, 6);
    const cellOf = (tk) => tk.node.parentElement && tk.node.parentElement.closest('.cue-seg,td,th,p,li,h1,h2,h3,h4');
    const cell = cellOf(t);
    let a = idx;
    while (a > 0 && idx - a < 9 && cellOf(tokens[a - 1]) === cell) a--;
    const snippet = tokens.slice(a, idx + 1).map(x => x.raw).join(t.en ? ' ' : '');
    return { label, snippet: (a > 0 && cellOf(tokens[a - 1]) === cell ? '…' : '') + snippet };
  }
  function resetMatch() { vmMatch.textContent = T('mWait'); vmMatch.className = 'vm-match'; $('vmBar').style.width = '0%'; $('vmPct').textContent = '0%'; }
  function showMatch(hit) {
    const info = rowInfo(hit.idx) || { label: '', snippet: '' };
    const pct = Math.round(clamp(hit.ratio != null ? hit.ratio : hit.score, 0, 1) * 100);
    vmMatch.textContent = info.label ? T('mHit', { l: info.label, s: info.snippet }) : T('mHitNoLabel', { s: info.snippet });
    vmMatch.className = 'vm-match hit';
    $('vmBar').style.width = pct + '%'; $('vmPct').textContent = pct + '%';
    showMatch.last = { idx: hit.idx, label: info.label, pct };
  }
  function showMiss() {
    vmMatch.textContent = T('mMiss');

  }
  function blockOf(i) { const t = tokens[i]; const el = t && t.node.parentElement; return el ? (el.closest('.cue-seg,tr,p,li,h1,h2,h3,h4') || el) : null; }
  function onHeard(interim) {
    const recent = (finals.length ? finals[finals.length - 1] : '') + (interim || '');

    if (!heard.length || !tokens.length) return;
    let hit = matchWindow(heard);
    // 防单字误跳：这次新说出的有效字（滤掉呃 / 嗯等口头禅）不足 3 个时，不允许跨段向前推进
    if (hit && hit.idx > anchorIdx && tokens[anchorIdx] && tokens[hit.idx] && blockOf(hit.idx) !== blockOf(anchorIdx)) {
      const fresh = filterFillers(tokenizeTranscript(interim || (finals.length ? finals[finals.length - 1] : '')));

    }
    if (hit) {
      // 只前进或小幅回退（≤2 字），往回重念不会把屏幕拽回去
      if (hit.idx >= anchorIdx - 2) {

        anchorIdx = hit.idx;
        applyHighlight();
        if (!manualOverride) followTo(hit.idx, prev);

    }
  }

  // ─────────────────────────────────────────────
  // 模拟试读：真实流式节奏（逐字 interim → final）
  // ─────────────────────────────────────────────
  let sim = null;
  function buildSimPhrases() {
    let units = [...content.querySelectorAll('tr, .cue-seg')]
      .filter(el => el.classList.contains('cue-seg') || (el.dataset.cueId && el.dataset.idx && !el.querySelector('th') && el.cells.length))
      .map(el => ({ el, text: el.classList.contains('cue-seg') ? el.textContent : (spokenCell(el) || el.cells[0]).textContent }));
    if (!units.length) units = [...content.querySelectorAll('p,h1,h2,h3,h4,li')].map(el => ({ el, text: el.textContent }));
    const cur = tokens[anchorIdx] && tokens[anchorIdx].node.parentElement;
    let start = units.findIndex(u => cur && u.el.contains(cur));
    if (start < 0) start = 0;
    const en = docIsEnglish();
    const phrases = [{ text: en ? 'Hello hello, can you hear me' : '喂喂，听得到吗', off: true }];
    units.slice(start).forEach((u, k) => {
      const parts = u.text.split(en ? /[,.!?;:]+(?=\s|$)/ : /[，。！？；：,.!?;:]/).map(s => s.trim()).filter(Boolean);
      parts.forEach((p, j) => phrases.push({ text: (k === 2 && j === 0 ? (en ? 'um, ' : '呃') : '') + p }));
    });
    return phrases;
  }
  function startSimulate(msPerChar) {
    if (wantMic || micOn) stopMic();
    stopSimulate(true);
    if (!tokens.length) tokenize();
    const phrases = buildSimPhrases();
    const ms = msPerChar || 125;
    finals = []; renderTranscript('');
    resetMatch();
    sim = { phrases, pi: 0, ci: 0, rest: 0, timer: null, en: docIsEnglish() };
    vmDev.textContent = T('devSim');
    setVState('sim');
    followVoice = true;
    sim.timer = setInterval(() => {
      if (!sim) return;
      if (sim.rest > 0) { sim.rest--; return; }
      const ph = sim.phrases[sim.pi];
      if (!ph) { finishSimulate(); return; }
      if (sim.en) { // 英文按单词流式吐出（真实识别也是整词 interim）
        let k = ph.text.indexOf(' ', sim.ci + 1); sim.ci = k < 0 ? ph.text.length : k;
        sim.rest = 1;
      } else sim.ci++;

      simLevel = 0.42 + Math.random() * 0.45;
      beat();
      renderTranscript(interim);
      onHeard(interim);
      if (sim.ci >= ph.text.length) {
        pushFinal(ph.text);
        renderTranscript('');
        onHeard('');
        sim.pi++; sim.ci = 0; sim.rest = 3;
      }
    }, ms);
  }
  function finishSimulate() {
    stopSimulate(true);
    setVState('off', { hint: 'vSimDone' });
  }
  function stopSimulate(silent) {
    if (!sim) return;
    clearInterval(sim.timer);
    sim = null;
    simLevel = 0;
    followVoice = false;
    vmDev.textContent = T('devOff');
    if (!silent) setVState('off');
  }

  // ─────────────────────────────────────────────
  // 右侧原版三段无极变速触控板
  // ─────────────────────────────────────────────
  const speed = {
    max: 7, target: 0, current: 0, remainder: 0, smoothing: 0.18,
    paused: true, lastTarget: 0, lastCurrent: 0, source: 'none'
  };
  const voiceActive = () => wantMic || micOn || !!sim;
  let hoverZone = null;
  let midCache = '';

  function renderMid(force) {
    let txt;
    const src = { keyboard: T('srcKeyboard'), mouse: T('srcMouse'), pauseRestore: T('srcRestore'), none: '—' };
    if (mode !== 'cue' && speed.paused) txt = T('midSetup');
    else if (voiceActive() && hoverZone === 'mid') txt = T('midHoverStop');
    else if (voiceActive() && !manualOverride) txt = (sim ? T('midSimR') : T('midVoice')) + '\n' + T('midVoiceSub');
    else if (speed.paused) txt = T('midPaused');
    else txt = T('midRun', { v: speed.current.toFixed(2), s: src[speed.source] || '—' });
    if (force || txt !== midCache) {
      const [h, ...rest] = txt.split('\n');
      $('midLab').innerHTML = `<b>${escapeHtml(h)}</b><small>${escapeHtml(rest.join('\n'))}</small>`;
      midCache = txt;
    }
    const v = (manualOverride || !speed.paused) ? Math.abs(speed.current) : (followVoice ? Math.abs(followVel) / 60 : 0);
    const sv = v.toFixed(2) + ' px/f';
    if ($('spdVal').textContent !== sv) $('spdVal').textContent = sv;
    zoneMid.classList.toggle('running', !speed.paused || voiceActive());
  }

  const UP_DEF = () => `<b>${T('upT')}</b><small>${T('upS')}</small>`;
  const DOWN_DEF = () => `<b>${T('downT')}</b><small>${T('downS')}</small>`;
  function setZoneUI(zone, n, target, allowed) {
    hoverZone = zone;
    zoneUp.classList.toggle('active', zone === 'up');
    zoneDown.classList.toggle('active', zone === 'down');
    zoneUp.querySelector('.zbar').style.height = zone === 'up' ? (n * 100) + '%' : '0';
    zoneDown.querySelector('.zbar').style.height = zone === 'down' ? (n * 100) + '%' : '0';
    const tip = allowed ? '' : `<small>${T('zonePausedTip')}</small>`;
    $('upLab').innerHTML = zone === 'up' ? `<b>${T('upT')} · ${target.toFixed(2)} px/f</b>${tip || `<small>${T('upS')}</small>`}` : UP_DEF();
    $('downLab').innerHTML = zone === 'down' ? `<b>${T('downT')} · +${target.toFixed(2)} px/f</b>${tip || `<small>${T('downS')}</small>`}` : DOWN_DEF();
  }

  function updatePointerSpeed(clientY) {
    const allowed = !speed.paused || voiceActive();
    const up = zoneUp.getBoundingClientRect();
    const mid = zoneMid.getBoundingClientRect();
    const down = zoneDown.getBoundingClientRect();
    const sens = st.sensitivity / 100;
    let zone, n = 0, target = 0;
    if (clientY < mid.top) {
      zone = 'up';
      n = clamp((mid.top - clientY) / Math.max(up.height, 1), 0, 1);
      target = -(n ** 2) * speed.max * sens;
    } else if (clientY <= mid.bottom) {
      zone = 'mid';
    } else if (clientY <= down.bottom) {
      zone = 'down';
      n = clamp((clientY - mid.bottom) / Math.max(down.height, 1), 0, 1);
      target = (n ** 2) * speed.max * sens;
    } else {
      zone = 'sliders';
    }
    if (clientY < up.top) zone = 'sliders';
    setZoneUI(zone, n, target, allowed);
    if (!allowed || zone === 'sliders') { renderMid(); return; }
    speed.target = target;
    speed.source = 'mouse';
    if (voiceActive()) { manualOverride = true; followVoice = false; }
    renderMid();
  }

  function togglePause() {
    speed.paused = !speed.paused;
    if (speed.paused) {
      speed.lastTarget = speed.target; speed.lastCurrent = speed.current;
      speed.target = 0; speed.current = 0; speed.remainder = 0; speed.source = 'none';
    } else {
      speed.target = speed.lastTarget; speed.current = speed.lastCurrent; speed.source = 'pauseRestore';
      if (hoverZone === 'mid') speed.target = 0;
    }
    renderMid(true);
  }

  async function startWithCountdown() {
    if (!speed.paused) { togglePause(); return; }
    if (st.countdown) {
      countEl.style.display = 'flex';
      for (let n = 3; n >= 1; n--) { countEl.textContent = String(n); await sleep(650); }
      countEl.style.display = 'none';
    }
    if (speed.paused) togglePause();
    if (Math.abs(speed.target) < 0.01) { speed.target = 1.2 * (st.sensitivity / 100); speed.source = 'keyboard'; }
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ─────────────────────────────────────────────
  // RAF 主循环
  // ─────────────────────────────────────────────
  let lastFrame = 0;
  let followPos = null;
  let followVel = 0;       // px/s
  let followFast = false;  // 跨段快追态
  let lastHitAt = -1e9;
  let hitBase = 0;
  let lineStep = 0;
  // 字词级连续目标：命中 token 所在折行的中心 + 行内阅读进度 × 行距
  function followTarget(idx) {
    const t = tokens[idx];
    if (!t || !t.node.isConnected) return null;
    const r = document.createRange();
    r.setStart(t.node, t.start);
    r.setEnd(t.node, Math.min(t.end, t.node.nodeValue.length));
    const rect = r.getClientRects()[0] || r.getBoundingClientRect();
    const sr = scroller.getBoundingClientRect();
    const block = (t.node.parentElement && t.node.parentElement.closest('.cue-seg,td,th,p,li,h1,h2,h3,h4')) || content;
    const br = block.getBoundingClientRect();
    const lh = parseFloat(getComputedStyle(block).lineHeight) || rect.height * 1.6;
    const prog = clamp(st.mirror ? (br.right - rect.left) / Math.max(br.width, 1) : (rect.right - br.left) / Math.max(br.width, 1), 0, 1);
    const center = rect.top - sr.top + scroller.scrollTop + rect.height / 2;
    return { y: center + prog * lh, lh, prog };
  }
  function followTo(idx, prevIdx) {
    const f = followTarget(idx);
    if (!f) return;
    const want = Math.max(0, f.y - eyeY());
    if (idx >= prevIdx) targetScrollTop = Math.max(targetScrollTop, want);
    else if (idx < prevIdx - 2) targetScrollTop = want;
    hitBase = targetScrollTop;
    lineStep = f.lh;
    lastHitAt = performance.now();
    followVoice = true;
  }
  function tick(now) {
    if (!lastFrame) lastFrame = now;
    const ff = clamp((now - lastFrame) / 16.6667, 0.2, 3);
    const dt = clamp((now - lastFrame) / 1000, 0.001, 0.05);
    lastFrame = now;
    const va = voiceActive();

    if (manualOverride || (!speed.paused && !va)) {
      const blend = 1 - Math.pow(1 - speed.smoothing, ff);
      speed.current += (speed.target - speed.current) * blend;
      const frameDelta = speed.current * ff + speed.remainder;
      const whole = frameDelta > 0 ? Math.floor(frameDelta) : Math.ceil(frameDelta);
      speed.remainder = frameDelta - whole;
      if (whole) scroller.scrollTop += whole;
    } else if (followVoice) {
      // 说话期间的预读微漂移：在两次识别结果之间缓慢上浮，停口 1.8s 内平滑归零，最多领先 0.9 行
      const since = now - lastHitAt;
      if (va && !followFast && lineStep && since < 1800 && st.drift > 0) {
        targetScrollTop = Math.min(hitBase + lineStep * 0.9, targetScrollTop + st.drift * dt * (1 - since / 1800));
      }
      if (followPos == null || Math.abs(followPos - scroller.scrollTop) > 2) { followPos = scroller.scrollTop; }
      const maxTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
      const err = clamp(targetScrollTop, 0, maxTop) - followPos;
      if (!followFast && Math.abs(err) > 220) followFast = true;
      else if (followFast && Math.abs(err) < 120 && Math.abs(followVel) < (st.cruiseMax || 115)) followFast = false;
      const cruise = st.cruiseMax || 115;
      // 跳段：按距离指数追赶（≈0.6s 内收进 120px），近临界阻尼；收进且速度降到巡航以下后回到粘滞巡航
      const desired = followFast ? clamp(err * 4.2, -4000, 4000) : clamp(err * 1.35, -cruise * 0.83, cruise);
      const visc = followFast ? 24 : st.viscosity;
      followVel += (desired - followVel) * (1 - Math.exp(-dt * visc));
      const stepPx = followVel * dt;
      if ((err >= 0 && stepPx > err) || (err <= 0 && stepPx < err)) { followPos = followPos + err; followVel = 0; } // 不越过目标 = 零过冲
      else followPos += stepPx;
      followPos = clamp(followPos, 0, maxTop);
      scroller.scrollTop = followPos;
      if (Math.abs(err) < 0.6 && Math.abs(followVel) < 3) {
        followVel = 0;
        if (!va) { followVoice = false; followPos = null; }
      }
    }
    monitorTick(performance.now());
    updateProgress();
    renderMid();
    requestAnimationFrame(tick);
  }

  // ─────────────────────────────────────────────
  // 画幅 / 主题 / 镜像 / 字号 / 缩放 / 视线 / 目录
  // ─────────────────────────────────────────────
  function applyAspect(w, h, noSave) {
    st.aspect = { w, h };
    const area = stageWrap.getBoundingClientRect();
    const ratio = w / h;
    if (ratio >= area.width / Math.max(area.height, 1)) {
      stage.style.width = '100%'; stage.style.height = (area.width / ratio) + 'px';
    } else {
      stage.style.height = '100%'; stage.style.width = (area.height * ratio) + 'px';
    }
    document.querySelectorAll('.aspect').forEach(btn => {
      btn.classList.toggle('on', !btn.hasAttribute('data-free') && +btn.dataset.w === w && +btn.dataset.h === h);
    });
    updateCueTag();
    if (!noSave) save();
  }
  function resetAspect() {
    st.aspect = { w: null, h: null };
    stage.style.width = '100%'; stage.style.height = '100%';
    document.querySelectorAll('.aspect').forEach(btn => btn.classList.toggle('on', btn.hasAttribute('data-free')));
    updateCueTag();
    save();
  }
  function applyTheme() {
    document.documentElement.dataset.theme = st.theme === 'paper' ? 'paper' : 'studio';
    document.querySelectorAll('.btnTheme').forEach(b => b.classList.toggle('is-light', st.theme === 'paper'));
    fixDarkColors(content);
    updateCueTag();
  }
  function applyMirror() {
    scroller.classList.toggle('mirror', !!st.mirror);
    $('btnMirror').classList.toggle('on', !!st.mirror);
    if ($('chkMirror')) $('chkMirror').checked = !!st.mirror;
    updateCueTag();
  }
  function applyFont() {
    document.documentElement.style.setProperty('--font-size', st.fontSize + 'px');
    $('fVal').textContent = st.fontSize;
  }
  // 缩放 = 真实排版字号乘数（50%–500%），文字在框内重排折行，不再用 transform 撑出屏幕
  function applyZoom(keepAnchor) {
    st.zoom = clamp(Math.round(+st.zoom || 100), 50, 500);
    content.style.transform = '';
    document.documentElement.style.setProperty('--zoom', String(st.zoom / 100));
    $('zoom').value = st.zoom;
    $('zoomVal').textContent = st.zoom + '%';
    if ($('defZoom')) { $('defZoom').value = st.zoom; $('defZoomVal').textContent = st.zoom + '%'; }
  }
  function applyEye() {
    document.documentElement.style.setProperty('--eye', st.eyeLine + '%');
    $('eyeLine').value = st.eyeLine; $('eyeLineVal').textContent = st.eyeLine + '%';
    $('eyeLab').textContent = T('eyeLab', { p: st.eyeLine });
  }
  function applySide() {
    document.documentElement.style.setProperty('--side-w', st.sideW + 'px');
    workspace.classList.toggle('side-collapsed', !st.side);
    $('btnSide').classList.toggle('on', !!st.side);
  }

  // ─── 文稿加载 ───
  function loadHtml(html, resetDone) {
    content.innerHTML = html || '<p></p>';
    if (resetDone) st.done = {};
    relaxAllTables(content);
    fixDarkColors(content);
    rebuildToc();
    tokenize();
    anchorIdx = 0;
    applyHighlight();
    scroller.scrollTop = 0; targetScrollTop = 0;
    updateProgress();
    save();
    if (vstate === 'off' || vstate === 'sim') $('vmLang').textContent = recLangEff();
  }
  let reindexT = null;
  function scheduleReindex() {
    clearTimeout(reindexT);
    reindexT = setTimeout(() => { relaxAllTables(content); fixDarkColors(content); rebuildToc(); tokenize(); applyHighlight(); save(); }, 280);
  }

  // 语音监控窗：拖拽 / 折叠
  function clampVmon() {
    if (!vmon.style.top) return;
    const w = stageWrap.getBoundingClientRect();
    const r = vmon.getBoundingClientRect();
    vmon.style.left = clamp(parseFloat(vmon.style.left) || 0, 0, Math.max(0, w.width - r.width)) + 'px';
    vmon.style.top = clamp(parseFloat(vmon.style.top) || 0, 0, Math.max(0, w.height - r.height)) + 'px';
  }
  function wireVmon() {
    const head = $('vmHead');
    let drag = null;
    head.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      const r = vmon.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      head.setPointerCapture(e.pointerId);
    });
    head.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const w = stageWrap.getBoundingClientRect();
      const r = vmon.getBoundingClientRect();
      vmon.style.left = clamp(e.clientX - w.left - drag.dx, 0, w.width - r.width) + 'px';
      vmon.style.top = clamp(e.clientY - w.top - drag.dy, 0, w.height - r.height) + 'px';
      vmon.style.bottom = 'auto';
    });
    head.addEventListener('pointerup', () => { drag = null; });
    $('vmFold').onclick = () => {
      vmon.classList.toggle('folded');
      clampVmon();
    };
  }

  // ─────────────────────────────────────────────
  // 事件绑定
  // ─────────────────────────────────────────────
  function wire() {
    $('btnReady').onclick = () => enterCue();
    $('btnVoiceGo').onclick = () => startVoice();
    $('btnBack').onclick = () => exitCue();
    $('fDown').onclick = () => { st.fontSize = Math.max(14, st.fontSize - 2); applyFont(); refreshTokenY(); save(); };
    $('fUp').onclick = () => { st.fontSize = Math.min(96, st.fontSize + 2); applyFont(); refreshTokenY(); save(); };

    document.querySelectorAll('.goHome').forEach(b => { b.onclick = () => goHome(); });
    $('btnMirror').onclick = () => { st.mirror = !st.mirror; applyMirror(); save(); };

    $('chkMirror').onchange = () => { st.mirror = $('chkMirror').checked; applyMirror(); save(); };
    $('defZoom').oninput = () => { st.zoom = +$('defZoom').value; applyZoom(); relayout(); save(); };

    document.querySelectorAll('.aspect').forEach(btn => {

    $('aspH').onchange = applyCustom;

    $('zoom').oninput = () => { st.zoom = +$('zoom').value; applyZoom(); relayout(); save(); };
    $('zoomDown').onclick = () => { st.zoom -= 5; applyZoom(); relayout(); save(); };
    $('zoomUp').onclick = () => { st.zoom += 5; applyZoom(); relayout(); save(); };
    $('zoomVal').ondblclick = () => { st.zoom = 100; applyZoom(); relayout(); save(); };
    wireSideResizer();
    $('sens').oninput = () => { st.sensitivity = +$('sens').value; $('sensVal').textContent = st.sensitivity + '%'; save(); };

    $('recLang').onchange = () => { st.recLang = $('recLang').value; $('vmLang').textContent = recLangEff(); save(); if (wantMic) startMic(); };
    $('fwdWin').oninput = () => { st.fwdWin = +$('fwdWin').value; $('fwdWinVal').textContent = st.fwdWin; save(); };
    $('backWin').oninput = () => { st.backWin = +$('backWin').value; $('backWinVal').textContent = st.backWin; save(); };
    $('visc').oninput = () => { st.viscosity = +$('visc').value; $('viscVal').textContent = st.viscosity.toFixed(1); save(); };
    $('cruise').oninput = () => { st.cruiseMax = +$('cruise').value; $('cruiseVal').textContent = st.cruiseMax; save(); };
    $('drift').oninput = () => { st.drift = +$('drift').value; $('driftVal').textContent = st.drift; save(); };
    $('eyeLine').oninput = () => { st.eyeLine = +$('eyeLine').value; applyEye(); relayout(); save(); };

    // 阅读视线拖拽
    let dragging = false;
    guideHandle.addEventListener('pointerdown', (e) => { dragging = true; guideHandle.setPointerCapture(e.pointerId); });
    guideHandle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = stage.getBoundingClientRect();
      st.eyeLine = clamp(Math.round(((e.clientY - rect.top) / rect.height) * 100), 20, 55);
      applyEye();
    });
    guideHandle.addEventListener('pointerup', () => { dragging = false; save(); updateCueTag(); });

    // 触控板
    touch.addEventListener('mousemove', (e) => updatePointerSpeed(e.clientY));
    touch.addEventListener('mouseleave', () => {
      setZoneUI(null, 0, 0, true);
      speed.target = 0; speed.source = 'mouse';
      if (manualOverride) {
        speed.current = 0; speed.remainder = 0;
        reanchorToEyeLine();
        manualOverride = false;
        followVoice = voiceActive();
        targetScrollTop = scroller.scrollTop;
      }
      renderMid(true);
    });
    zoneMid.addEventListener('click', () => {
      if (mode !== 'cue') { enterCue(); if (speed.paused) togglePause(); return; }
      togglePause();
    });

    // 滚轮 = 临时手动
    scroller.addEventListener('wheel', () => {
      if (!voiceActive()) return;
      manualOverride = true; followVoice = false; speed.target = 0; speed.current = 0;
      clearTimeout(scroller._wheelT);
      scroller._wheelT = setTimeout(() => {
        reanchorToEyeLine(); manualOverride = false; followVoice = voiceActive(); targetScrollTop = scroller.scrollTop;
      }, 600);
    }, { passive: true });
    let eyeRaf = 0;
    scroller.addEventListener('scroll', () => { updateProgress(); if (!eyeRaf) eyeRaf = requestAnimationFrame(() => { eyeRaf = 0; trackEyeIdx(); }); }, { passive: true });

    // 极简态：点任意行 → 对齐视线并重置跟读锚点
    content.addEventListener('click', (e) => {
      if (mode !== 'cue') return;
      let el = e.target;
      while (el && el !== content) {
        if (el.tagName === 'TR' || /^H[1-4]$/.test(el.tagName) || el.tagName === 'P' || el.tagName === 'LI' || el.classList.contains('cue-seg')) {
          refreshTokenY();
          let idx = el.dataset.cueId ? tokens.findIndex(t => t.blockId === el.dataset.cueId) : -1;
          if (idx < 0) {
            const y = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop + 8;
            idx = tokenIndexNearY(y);
          }
          if (el.tagName === 'TR' && el.cells.length > 1) {
            const sc = spokenCell(el) || el.cells[1];
            const j = tokens.findIndex(t => sc.contains(t.node));
            if (j >= 0) idx = j; // 跳过镜号列，锚到口播列第一个字
          }
          if (tokens[idx]) setAnchor(idx, false);
          return;
        }
        el = el.parentElement;
      }
    });

    content.addEventListener('input', scheduleReindex);
    content.addEventListener('paste', (e) => {
      // 整篇新稿（含表格或较长文本）粘贴前，把当前自己的稿存为「上一版粘稿」
      const cd = e.clipboardData;
      const big = cd && (/<table/i.test(cd.getData('text/html') || '') || (cd.getData('text/plain') || '').length > 80);
      const cur = content.innerHTML;
      if (big && content.textContent.trim() && !isStockDoc(cur)) st.prevPaste = cur;
      dropFmtSnap(); updateFmtButtons();
      setTimeout(scheduleReindex, 50);
    });

    document.addEventListener('keydown', (e) => {
      if ($('help').classList.contains('show')) {
        if (e.key === 'Escape' || e.key.length === 1 || e.key === 'Enter') $('help').classList.remove('show');
        return;
      }
      if ($('pop').classList.contains('show') && e.key === 'Escape') { $('pop').classList.remove('show'); return; }
      if ($('aiPanel').classList.contains('show')) { if (e.key === 'Escape') $('aiPanel').classList.remove('show'); return; }
      if (mode === 'home') return;
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) return;
      const inEdit = mode === 'setup' && ae && (ae === content || content.contains(ae));
      if (e.key === 'Escape') {
        if (mode === 'cue') { e.preventDefault(); exitCue(); }
        return;
      }
      if (inEdit) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (mode === 'setup') enterCue();
        startWithCountdown();
      } else if (e.key === '?' || (e.shiftKey && e.key === '/')) {
        $('help').classList.add('show');
      } else if (e.code === 'KeyM') {
        st.mirror = !st.mirror; applyMirror(); save();
      } else if (e.code === 'KeyL' && mode === 'setup') {
        st.side = !st.side; applySide(); relayout(); save();
      } else if (e.code === 'KeyF') {
        $('btnFs').click();
      } else if (e.code === 'Equal' || e.code === 'NumpadAdd') {
        st.zoom = Math.min(500, st.zoom + 5); applyZoom(); relayout(); save();
      } else if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
        st.zoom = Math.max(50, st.zoom - 5); applyZoom(); relayout(); save();
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (mode === 'setup') enterCue();
        if (speed.paused) { speed.paused = false; speed.target = 0; speed.current = 0; }
        const dir = (e.code === 'ArrowDown' || e.code === 'KeyS') ? 1 : -1;
        speed.target = clamp(speed.target + dir * 0.5 * (st.sensitivity / 100), -speed.max, speed.max);
        speed.source = 'keyboard';
        if (voiceActive()) { manualOverride = true; followVoice = false; }
      }
    });

    window.addEventListener('resize', () => { clampVmon(); });
    // 舞台尺寸 / 正文宽度变化（拉窗口、缩放、字号、目录拖宽）：保持视线处的字不跑偏，刷新坐标索引
    if (window.ResizeObserver) {
      let lastW = 0, lastH = 0, lastCW = 0;
      const ro = new ResizeObserver(() => {
        const w = stageWrap.clientWidth, h = stageWrap.clientHeight, cw = content.clientWidth;
        if (w === lastW && h === lastH && cw === lastCW) return;
        lastW = w; lastH = h; lastCW = cw;
        relayout();
      });
      ro.observe(stageWrap); ro.observe(content);
    }
    window.addEventListener('beforeunload', save);
    wireVmon();
  }

        cuePg: $('cuePg').textContent, vstate, anchorIdx, tokenCount: tokens.length, scrollTop: scroller.scrollTop,
        paused: speed.paused, speedTarget: speed.target, speedCurrent: speed.current,
        manualOverride, followVoice, simRunning: !!sim, wantMic, micOn,
        eyeLine: st.eyeLine, theme: st.theme, mirror: st.mirror,
        monitor: {
          state: vmStateEl.textContent, final: vmFinal.textContent, interim: vmInterim.textContent,
          match: vmMatch.textContent, hint: vmHint.textContent, device: vmDev.textContent,
          cellsOn: drawCells.n || 0, cells: vmCells.length
        },
        lastMatch: showMatch.last || null,
        targetScrollTop, followVel, followFast, formatted: !!st.fmtSnap, prevPaste: !!st.prevPaste,
        missCount: showMatch.missCount || 0,
        tocCount: side.querySelectorAll('.item[data-id]').length
      };
    },
    feedTranscript(text, isFinal) {
      if (isFinal) { pushFinal(text); renderTranscript(''); onHeard(''); }
      else { renderTranscript(String(text || '')); onHeard(String(text || '')); }
      return this.getState();
    },
    simulate(ms) { enterCue(); startSimulate(ms); return this.getState(); },
    stopSimulate() { stopSimulate(); },
    setAnchor(i) { setAnchor(i, true); return this.getState(); },
    loadExample() { loadHtml(EXAMPLE_HTML, true); return this.getState(); },
    loadExampleEn() { loadHtml(EXAMPLE_EN_HTML, true); return this.getState(); },
    scoreWords(a, b) { const x = tokenizeTranscript(a)[0], y = tokenizeTranscript(b)[0]; return x && y ? scorePair(x, y) : 0; },
    filtered(text) { return filterFillers(tokenizeTranscript(text)).map(t => t.raw); },
    tokenRaw(i) { return tokens[i] && tokens[i].raw; },
    simulateHit(i) { const prev = anchorIdx; anchorIdx = clamp(i, 0, tokens.length - 1); applyHighlight(); followTo(anchorIdx, prev); return this.getState(); },
    tokenIndexOf(sel, nth) { const el = content.querySelector(sel); if (!el) return -1; const list = tokens.map((t, k) => k).filter(k => el.contains(tokens[k].node)); return list[nth == null ? 0 : (nth < 0 ? list.length + nth : nth)]; },
    tokensOf(sel) { const el = content.querySelector(sel); return el ? tokens.filter(t => el.contains(t.node)).map(t => t.raw) : null; },
    followTarget(i) { return followTarget(i == null ? anchorIdx : i); },
    anchorRowLabel() { const i = rowInfo(anchorIdx); return i && i.label; },
    eyeOffset() {
      refreshTokenY();
      const t = tokens[anchorIdx];
      return t ? (t.y - scroller.scrollTop) - eyeY() : null;
    },
    charPinyin, fuzzyPinyin,
    scorePair: (a, b) => scorePair(a, b),
    match(text) { return matchWindow(tokenizeTranscript(text)); }
  };


  // ═════════════════════════════════════════════
  // v3.2：窄表撑宽居中 · 目录截断 ·  排版规整 ·  AI 标重音 · 选区小工具条
  // ═════════════════════════════════════════════
  const pad2 = (n) => String(n).padStart(2, '0');
  function pxOf(v) {
    if (v == null || v === '') return null;
    const m = String(v).trim().match(/^([\d.]+)\s*(px|pt)?$/i);
    if (!m) return null;
    return parseFloat(m[1]) * (m[2] && m[2].toLowerCase() === 'pt' ? 4 / 3 : 1);
  }
  const cellText = (c) => (c ? c.textContent.replace(/\s+/g, ' ').trim() : '');
  function effCols(tb) {
    let max = 0;
    for (const tr of tb.rows) max = Math.max(max, [...tr.cells].filter(c => cellText(c)).length);
    return max;
  }
  function declaredWidth(tb) {
    const w = pxOf(tb.getAttribute('width')) || pxOf(tb.style.width);
    if (w) return w;
    const cols = [...tb.querySelectorAll('col')];
    const sumCols = cols.reduce((s, c) => s + (pxOf(c.getAttribute('width')) || pxOf(c.style.width) || 0), 0);
    if (sumCols) return sumCols;
    const first = tb.rows[0];
    if (first) {
      const sumCells = [...first.cells].reduce((s, c) => s + (pxOf(c.getAttribute('width')) || pxOf(c.style.width) || 0), 0);
      if (sumCells) return sumCells;
    }
    return null;
  }
  // 粘贴 / 加载时清掉写死的版式：字号、行高、宽高、不换行（颜色 / 加粗 / 高亮一律不动）
  const BOX_PROPS = ['font-size', 'line-height', 'width', 'min-width', 'max-width', 'height', 'min-height', 'white-space', 'font-family', 'letter-spacing', 'text-indent'];
  function stripBoxStyles(el) {
    if (el.tagName === 'IMG') return;
    el.removeAttribute('width');
    el.removeAttribute('height');
    if (el.hasAttribute('nowrap')) el.removeAttribute('nowrap');
    if (!el.style || !el.style.length) return;
    BOX_PROPS.forEach(p => el.style.removeProperty(p));
    if (!el.getAttribute('style').trim()) el.removeAttribute('style');
  }
  function normalizeBox(root) { root.querySelectorAll('[style],[width],[height],[nowrap],font[size]').forEach(el => { if (el.tagName === 'FONT') el.removeAttribute('size'); stripBoxStyles(el); }); }
  // 表格：去掉 colgroup 死列宽，多列保留相对列宽（百分比），宽度交给 CSS（100% 自动折行）
  function relaxTable(tb) {
    if (tb.dataset.cueFixed) return;
    const single = effCols(tb) <= 1;
    let pct = null;
    if (!single) {
      const colEls = [...tb.querySelectorAll('col')];
      let ws = colEls.map(c => pxOf(c.getAttribute('width')) || pxOf(c.style.width));
      if (!ws.length || ws.some(x => !x)) ws = tb.rows[0] ? [...tb.rows[0].cells].map(c => pxOf(c.getAttribute('width')) || pxOf(c.style.width)) : [];
      if (ws.length && ws.every(x => x)) { const sum = ws.reduce((a, b) => a + b, 0); pct = ws.map(x => (x / sum) * 100); }
    }
    tb.querySelectorAll('colgroup, col').forEach(c => c.remove());
    [tb, ...tb.querySelectorAll('*')].forEach(stripBoxStyles);
    if (single) tb.classList.add('cue-single');
    else if (pct && tb.rows[0]) [...tb.rows[0].cells].forEach((c, i) => { if (pct[i] != null) c.style.width = pct[i].toFixed(1) + '%'; });
    tb.dataset.cueFixed = '1';
  }
  function relaxAllTables(root) { root.querySelectorAll('table').forEach(relaxTable); normalizeBox(root); }

  // ─── 颜色工具 ───
  function parseColorA(str) {
    if (!str) return null;
    str = String(str).trim().toLowerCase();
    if (/^(transparent|inherit|initial|unset|currentcolor|none|windowtext|auto)$/.test(str)) return null;
    let m = str.match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+%?))?\s*\)/);

    if (!units.length) units = [...content.querySelectorAll('p,li')];
    return units.filter(u => u.textContent.trim()).map((el, i) => {
      if (!el.dataset.aiId) el.dataset.aiId = 'u' + pad2(i + 1);
      return { el, id: el.dataset.aiId, text: plainText(el) };
    });
  }
  function plainText(el) {
    const c = el.cloneNode(true);
    c.querySelectorAll('[data-cue-ignore]').forEach(x => x.remove());
    return c.textContent;
  }
  function ensureUnitsReady() {
    // 单列表格 / 纯段落先做排版，标注落在干净的分段卡片上
    const needs = !content.querySelector('.cue-seg') && ([...content.querySelectorAll('table')].some(tb => effCols(tb) <= 1) || !content.querySelector('table'));
    if (needs) runLayout(); else snapshotOnce();
  }
  function buildPrompt(units) {
    return aiSystem() + '\n\n' + JSON.stringify({ items: units.map(u => ({ id: u.id, text: u.text })) }, null, 0);
  }
  const AI_ALLOWED = { STRONG: 'cue-stress', MARK: 'cue-key', SPAN: 'cue-term' };
  function sanitizeAi(html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(html || '');
    const out = document.createElement('div');
    (function walk(src, dst, depth) {
      src.childNodes.forEach(n => {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|NOSCRIPT|TITLE)$/.test(n.tagName)) return; // 连内容一起丢弃
        const cls = AI_ALLOWED[n.tagName];
        if (cls && depth === 0) {
          const el = document.createElement(n.tagName.toLowerCase());
          el.className = cls;
          el.textContent = n.textContent;
          dst.appendChild(el);
        } else walk(n, dst, depth + (cls ? 1 : 0));
      });
    })(tpl.content, out, 0);
    return out;
  }
  function parseAiJson(text) {
    const s = String(text || '');
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b <= a) throw new Error(T('aiNoJson'));
    const j = JSON.parse(s.slice(a, b + 1));
    if (!j || !Array.isArray(j.items)) throw new Error(T('aiNoItems'));
    return j.items;
  }
  function applyAiItems(items, units) {
    const byId = new Map(units.map(u => [u.id, u]));
    let ok = 0, bad = 0;
    items.forEach(it => {
      const u = byId.get(String(it.id));
      if (!u) return;
      const clean = sanitizeAi(it.html);
      if (clean.textContent !== u.text) { bad++; return; } // 改了字 → 拒收，保留原文
      u.el.innerHTML = clean.innerHTML;
      const note = String(it.note || '').trim().slice(0, 8);
      if (note) u.el.dataset.note = note; else delete u.el.dataset.note;
      ok++;
    });
    content.normalize();
    rebuildToc(); tokenize(); applyHighlight(); save();
    updateFmtButtons();
    return { ok, bad };
  }
  async function runAi() {
    const c = readAiForm();
    persistAi(c);
    if (!c.base || !c.model) { aiStatus(T('aiNeedBase'), 'bad'); return; }
    if (!c.key) { aiStatus(T('aiNeedKey'), 'bad'); return; }
    ensureUnitsReady();
    const units = aiUnits();
    if (!units.length) { aiStatus(T('aiNoUnits'), 'bad'); return; }
    const btn = $('aiRun');
    btn.disabled = true;
    let ok = 0, bad = 0;
    try {
      for (let i = 0; i < units.length; i += 8) {
        const batch = units.slice(i, i + 8);
        aiStatus(T('aiProg', { a: Math.min(i + 8, units.length), b: units.length }));
        let res;
        try {
          res = await fetch(c.base + '/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
            body: JSON.stringify({ model: c.model, temperature: 0.2, messages: [{ role: 'system', content: aiSystem() }, { role: 'user', content: JSON.stringify({ items: batch.map(u => ({ id: u.id, text: u.text })) }) }] })
          });
        } catch (e) {
          throw new Error(T('aiNet'));
        }
        if (!res.ok) throw new Error(T('aiHttp', { c: res.status }) + (res.status === 401 ? T('aiBadKey') : ''));
        const data = await res.json();
        const text = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
        const r = applyAiItems(parseAiJson(text), batch);
        ok += r.ok; bad += r.bad;
      }
      aiStatus(T('aiDone', { ok }) + (bad ? T('aiRejected', { bad }) : '') + T('aiUndo'), 'ok');
    } catch (e) {
      aiStatus(e.message, 'bad');
    } finally { btn.disabled = false; }
  }
  function copyPrompt() {
    ensureUnitsReady();
    const p = buildPrompt(aiUnits());
    const done = () => aiStatus(T('aiCopied'), 'ok');
    (navigator.clipboard ? navigator.clipboard.writeText(p) : Promise.reject()).then(done).catch(() => { $('aiPaste').value = p; aiStatus(T('aiCopyFail')); });
  }
  function applyPasted() {
    try {
      ensureUnitsReady();
      const r = applyAiItems(parseAiJson($('aiPaste').value), aiUnits());
      aiStatus(T('aiApplied', { ok: r.ok }) + (r.bad ? T('aiApplyRej', { bad: r.bad }) : ''), 'ok');
    } catch (e) { aiStatus(e.message, 'bad'); }
  }

  function wireFmt() {
    $('btnLayout').onclick = () => runLayout();
    $('btnFmtMenu').onclick = (e) => { e.stopPropagation(); const m = $('fmtMenu'); const r = $('btnLayout').getBoundingClientRect(); m.style.left = r.left + 'px'; m.style.top = (r.bottom + 6) + 'px'; m.classList.toggle('show'); };
    $('fmtMenu').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => $('fmtMenu').classList.remove('show'));
    $('optSegments').onchange = () => { st.fmt.segments = $('optSegments').checked; save(); if (st.fmtSnap) runLayout(); };
    document.querySelectorAll('input[name="optAlign"]').forEach(r => { r.onchange = () => { st.fmt.align = r.value; updateFmtButtons(); relayout(); save(); }; });
    $('btnRestore').onclick = () => restoreOriginal();
    $('btnPrev').onclick = () => swapPrevPaste();
    $('btnAi').onclick = () => openAi();
    $('aiClose').onclick = () => $('aiPanel').classList.remove('show');
    $('aiPreset').onchange = () => { const p = AI_PRESETS[$('aiPreset').value]; if (p && p.base) { $('aiBase').value = p.base; $('aiModel').value = p.model; } };
    $('aiRun').onclick = () => runAi();
    $('aiCopy').onclick = () => copyPrompt();
    $('aiApply').onclick = () => applyPasted();
    selBar.addEventListener('mousedown', (e) => e.preventDefault());
    selBar.querySelectorAll('button').forEach(b => { b.onclick = () => applySel(b.dataset.em); });
    document.addEventListener('selectionchange', () => { clearTimeout(placeSelBar._t); placeSelBar._t = setTimeout(placeSelBar, 60); });
    scroller.addEventListener('scroll', () => { if (selBar.classList.contains('show')) placeSelBar(); }, { passive: true });
  }


  // ═════════════════════════════════════════════
  // v4.0：I18N 应用 · 配置浮层 · 极简首页 · 启动
  // ═════════════════════════════════════════════
  function applyI18n() {
    const zh = st.ui !== 'en';
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.body.classList.toggle('ui-en', !zh);
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = T(el.dataset.i18nTitle); el.setAttribute('aria-label', el.title); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') el.placeholder = T(el.dataset.i18nPh); else el.dataset.ph = T(el.dataset.i18nPh);
    });
    document.querySelectorAll('.langSeg button').forEach(b => b.classList.toggle('a', b.dataset.lang === st.ui));
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
    document.querySelectorAll('.kmod').forEach(k => { k.textContent = isMac ? '⌘' : 'Ctrl'; });
    // 动态区
    const o = setVState.opts || {};
    setVState(vstate, o);
    if (!audio.stream && !sim) vmDev.textContent = T('devOff'); else if (sim) vmDev.textContent = T('devSim');
    if (!showMatch.last) resetMatch();
    setZoneUI(null, 0, 0, true);
    renderMid(true);
    rebuildToc(); applyHighlight();
    updateCueTag();
    document.title = 'Paste to Cue · ' + (zh ? '智能跟读提词器' : 'Voice-synced teleprompter');
    refreshHome();
  }
  function setUi(lang) {
    if (lang === st.ui) return;
    st.ui = lang === 'en' ? 'en' : 'zh'; st.uiChosen = true;
    applyI18n(); save();
  }

  // ─── 配置浮层（shadcn Popover）───
  const pop = $('pop');
  function openPop(btn) {
    syncSettingsForm();
    $('popKey').value = aiCfg().key || '';
    pop.classList.add('show');
    const r = btn.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = clamp(r.right - w, 8, window.innerWidth - w - 8) + 'px';
    pop.style.top = clamp(r.bottom + 8, 8, Math.max(8, window.innerHeight - h - 8)) + 'px';
    pop._btn = btn;
    document.querySelectorAll('.btnSet').forEach(b => b.classList.toggle('on', b === btn));
  }
  function closePop() { pop.classList.remove('show'); document.querySelectorAll('.btnSet').forEach(b => b.classList.remove('on')); }
  function wirePop() {
    document.querySelectorAll('.btnSet').forEach(b => { b.onclick = (e) => { e.stopPropagation(); if (pop.classList.contains('show') && pop._btn === b) closePop(); else openPop(b); }; });
    pop.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => closePop());
    window.addEventListener('resize', () => { if (pop.classList.contains('show') && pop._btn) openPop(pop._btn); });
    $('popKey').onchange = () => { const c = aiCfg(); c.key = $('popKey').value.trim(); persistAi(c); };
    $('popAiMore').onclick = () => { closePop(); openAi(); };
    document.querySelectorAll('.langSeg button').forEach(b => { b.onclick = () => setUi(b.dataset.lang); });
  }

  // ─── 极简首页 ───
  const homeInput = $('homeInput');
  function docSummary() {
    const text = content.textContent.trim();
    if (!text) return null;
    const tEl = content.querySelector('h1,h2,h3,h4,.cue-title') || side.querySelector('.item.title .txt');
    const n = segUnits().length || content.querySelectorAll('p,li').length || 1;
    let title = tEl ? tEl.textContent.trim() : text.slice(0, 14) + (text.length > 14 ? '…' : '');
    if (title.length > 24) title = title.slice(0, 24) + '…';
    return { title, n };
  }
  function refreshHome() {
    // 仅当 #content 是用户真实文稿时显示「继续」；内置中/英示例稿对新访客隐藏
    const d = (!isStockDoc(content.innerHTML) && docSummary()) || null;
    const txt = d ? T('resumeCur', { t: d.title, n: d.n }) : '';
    $('hResume').hidden = !d; $('hResumeTop').hidden = !d;
    $('hResumeTxt').textContent = txt;
    $('hResumeTop').title = txt;
  }
  window.__ptcRefreshHome = refreshHome;
  function homeHtml() {
    const box = homeInput.cloneNode(true);
    return box.textContent.trim() ? box.innerHTML : '';
  }
  function importHome(kind) {
    const html = homeHtml();
    if (!html) { if (kind === 'editor') { enterSetup(); return; } toast(T('emptyPaste')); homeInput.focus(); return; }
    loadDoc(html);
    homeInput.innerHTML = '';
    if (kind === 'format') runLayout();
    if (kind === 'editor') { enterSetup(); return; }
    showApp();
    enterCue();
    setTimeout(() => { const n = segUnits().length; if (n) toast(T('tImported', { n })); }, 60);
  }
  function wireHome() {
    $('hImport').onclick = () => importHome('cue');
    $('hFormat').onclick = () => importHome('format');
    $('hEditor').onclick = () => importHome('editor');
    $('hResume').onclick = () => { enterSetup(); enterCue(); };
    $('hResumeTop').onclick = () => { enterSetup(); enterCue(); };
    $('hSample').onclick = () => { homeInput.innerHTML = st.ui === 'en' ? EXAMPLE_EN_HTML : EXAMPLE_HTML; relaxAllTables(homeInput); fixDarkColors(homeInput); };
    homeInput.addEventListener('paste', () => {
      setTimeout(() => { relaxAllTables(homeInput); fixDarkColors(homeInput); }, 30);
    });
    homeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); importHome('cue'); }
    });
    window.addEventListener('hashchange', routeFromHash);
  }
  function routeFromHash() {
    const h = (location.hash || '').replace('#', '');
    if (h === 'cue') { if (mode !== 'cue') { if (mode === 'home') showApp(); enterCue(); } }
    else if (h === 'edit') { if (mode !== 'setup') enterSetup(); }
    else if (mode !== 'home') goHome();
  }

  // ─── Boot ───
  function boot() {
    applyTheme(); applyMirror(); applyFont(); applyZoom(); applyEye(); applySide();
    $('sens').value = st.sensitivity; $('sensVal').textContent = st.sensitivity + '%';
    syncSettingsForm();
    if (st.aspect && st.aspect.w) applyAspect(st.aspect.w, st.aspect.h, true); else { stage.style.width = '100%'; stage.style.height = '100%'; }
    wire();
    wireFmt();
    wirePop();
    wireHome();
    $('sens').addEventListener('input', () => { $('sensVal').textContent = st.sensitivity + '%'; });
    loadHtml(st.html || DEFAULT_HTML, false);
    updateFmtButtons();
    setVState(SpeechRec ? 'off' : 'errUnsupported');
    resetMatch();
    // 三态：无 #cue / #edit → 首页
    const h = (location.hash || '').replace('#', '');
    mode = 'home';
    if (h === 'cue') { showApp(); enterCue(); }
    else if (h === 'edit') { showApp(); }
    else document.body.classList.add('home');
    applyI18n();
    relayout();
    requestAnimationFrame(tick);
  }
  boot();
})();

</script>
